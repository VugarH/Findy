# The daily job: collect every store, build deals, price alerts, Telegram top deals.
# Runs on GitHub's machines against the production database (secret DATABASE_URL).
# Start it by hand under Actions → "Daily deals" → Run workflow.
name: Daily deals

on:
  schedule:
    # A backup only: Vercel Cron starts the run at 07:00 Baku (vercel.json, /api/cron/start-daily).
    # GitHub's timer is often hours late; this one does nothing if today's run already started.
    - cron: "17 5 * * *" # 05:17 UTC = 09:17 in Baku
  workflow_dispatch:
    inputs:
      only:
        description: "Only these store ids, comma-separated (empty = every store)"
        required: false
        default: ""

# Never two collections at once.
concurrency:
  group: collection
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MARKET: ${{ vars.MARKET || 'az' }}
      SITE_URL: ${{ vars.SITE_URL }}
      BOT_CONTACT: ${{ vars.BOT_CONTACT }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
      TELEGRAM_CHANNEL_LOCALE: ${{ vars.TELEGRAM_CHANNEL_LOCALE }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      # Admitad affiliate feeds (AliExpress…); without them those stores are simply skipped.
      ADMITAD_WEBSITE_ID: ${{ vars.ADMITAD_WEBSITE_ID }}
      ADMITAD_FEED_USER: ${{ vars.ADMITAD_FEED_USER }}
      ADMITAD_FEED_CODE: ${{ secrets.ADMITAD_FEED_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Skip if today's run already started (backup timer only)
        id: guard
        if: github.event_name == 'schedule'
        run: echo "ran=$(npm run --silent deals:ran-today | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Collect and publish
        if: steps.guard.outputs.ran != 'yes'
        env:
          # Through the environment, never pasted into the script.
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            npm run deals:run -- --only "$ONLY"
          else
            npm run deals:run
          fi
